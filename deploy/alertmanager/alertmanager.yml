# Deliberately empty local receiver: alerts remain visible in the local UI.
# No email, webhook, chat, or other outbound notification is configured.
global:
  resolve_timeout: 5m
route:
  receiver: local-only
  group_by: ['alertname', 'tool']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: local-only
